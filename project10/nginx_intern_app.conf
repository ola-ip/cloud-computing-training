# ==============================================================================
# SECTION 1: SERVER BLOCK CONFIGURATION
# Listens on Port 80 (HTTP) for local traffic
# ==============================================================================
server {

    # Define the TCP port Nginx listens on (Standard HTTP)
    listen 80;

    # Define acceptable hostnames/IPs (underscore '_' accepts any IP or localhost)
    server_name _;


    # ==========================================================================
    # SECTION 2: LOCATION BLOCK & ROUTING RULES
    # Captures all incoming web traffic starting at root '/'
    # ==========================================================================
    location / {

        # Forward incoming requests to the internal FastAPI app port
        proxy_pass http://127.0.0.1:8000;


        # ======================================================================
        # SECTION 3: REVERSE PROXY HEADER PRESERVATION
        # Preserve client IP and protocol data so backend isn't blind
        # ======================================================================

        # Passes original host header requested by client
        proxy_set_header Host $host;

        # Passes true client IP address to backend
        proxy_set_header X-Real-IP $remote_addr;

        # Preserves full chain of client IP addresses if passed through proxies
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Informs backend whether client connected via HTTP or HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
